<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolha Sabiamente</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0618;overflow:hidden;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:#fff}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#c{position:absolute;left:0;top:0;width:1920px;height:1080px}
#qbox{position:absolute;left:160px;top:22px;width:1600px;min-height:150px;padding:18px 40px;border-radius:30px;
 background:linear-gradient(180deg,#5b2bd8,#2a0f7a);border:6px solid #ffd23f;box-shadow:0 0 0 6px #1b0a52,0 12px 40px #000a,inset 0 0 40px #8a5cff66;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#qtag{font-family:'Lilita One',Impact,sans-serif;font-size:30px;letter-spacing:4px;color:#ffd23f;text-shadow:0 3px 0 #0006}
#qtxt{font-family:'Lilita One',Impact,sans-serif;font-size:56px;line-height:1.1;text-shadow:0 4px 0 #1b0a52,0 0 20px #fff4;margin-top:4px}
#timer{position:absolute;right:30px;top:30px;width:110px;height:110px;border-radius:50%;background:#ffd23f;color:#2a0f7a;
 font-family:'Lilita One';font-size:60px;display:none;align-items:center;justify-content:center;border:6px solid #fff;box-shadow:0 6px 20px #000a}
#hud{position:absolute;left:20px;top:200px;font-family:'Lilita One';font-size:30px;text-shadow:0 3px 0 #000a;line-height:1.2}
#hud b{color:#ffd23f}
#help{position:absolute;left:20px;bottom:150px;font-size:24px;background:#000a;padding:10px 16px;border-radius:14px;max-width:560px;line-height:1.25}
#help b{color:#ffd23f}
#toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);font-family:'Lilita One';font-size:40px;background:#000c;border:4px solid #ffd23f;padding:10px 40px;border-radius:20px;display:none;text-align:center;white-space:nowrap}
#winner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:205px;background:linear-gradient(#000a,#0000 55%);text-align:center}
#winner .a{font-family:'Lilita One';font-size:60px;color:#ffd23f;text-shadow:0 5px 0 #7a3a00}
#winner .n{font-family:'Lilita One';font-size:150px;line-height:1;text-shadow:0 8px 0 #2a0f7a,0 0 50px #ffd23f;animation:pulse 1s infinite alternate;max-width:1800px;word-break:break-all}
@keyframes pulse{to{transform:scale(1.08)}}
/* painel do streamer */
#panel{position:fixed;left:0;right:0;bottom:0;background:#120a30f2;border-top:3px solid #ffd23f;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:50;font-size:20px}
#panel.hide{display:none}
#panel button,#panel input,#panel select{font:inherit;padding:14px 24px;border-radius:12px;border:2px solid #5b2bd8;background:#1f1250;color:#fff}
#panel button{cursor:pointer;background:#5b2bd8;font-weight:800}
#panel button:hover{background:#7a4dff}
#panel button.go{background:#13a34a;border-color:#7dffb0}
#panel button.warn{background:#d9381e;border-color:#ffb0a0}
#panel button:disabled{opacity:.35;cursor:not-allowed}
#panel input[type=range]{width:200px;padding:0;vertical-align:middle}
#panel label{display:flex;align-items:center;gap:8px}
#panel input[type=checkbox]{width:22px;height:22px;padding:0}
#panel button.big{font-size:26px;padding:18px 34px}
#panel .sp{flex:1}
#status{font-weight:800;color:#ffd23f}
.ov{position:fixed;inset:0;background:#000c;z-index:80;display:none;align-items:center;justify-content:center}
.ov .box{background:#1a0f45;border:4px solid #ffd23f;border-radius:20px;padding:20px;max-width:96vw;max-height:92vh;overflow:auto;font-size:15px}
.ov h2{font-family:'Lilita One';color:#ffd23f;margin-bottom:8px}
.ov textarea{width:min(900px,90vw);height:46vh;background:#0d0726;color:#fff;border:2px solid #5b2bd8;border-radius:8px;padding:8px;font:14px/1.4 monospace}
.ov button{font:inherit;font-weight:800;padding:8px 16px;margin:8px 8px 0 0;border-radius:8px;border:0;background:#5b2bd8;color:#fff;cursor:pointer}
#fbox h2{font-size:30px}
.frow{display:flex;align-items:center;gap:12px;background:#2a1a70;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:20px}
.frow .fn{flex:1;word-break:break-all}.frow small{opacity:.75;display:block;font-size:15px}
.frow.cur{outline:3px solid #3fbf6f}
#fbox button{font:inherit;font-weight:800;font-size:20px;padding:10px 20px;border-radius:10px;border:0;background:#5b2bd8;color:#fff;cursor:pointer;margin:4px 6px 0 0}
#fbox button.go{background:#13a34a}#fbox button.gray{background:#444}
#fmsg{font-size:17px;opacity:.9;margin:6px 0}
#confirm{z-index:90}
#confirm .box{text-align:center;font-size:26px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="qbox"><div id="qtag">ESCOLHA SABIAMENTE</div><div id="qtxt">Digite !jogo no chat para entrar!</div></div>
  <div id="timer">0</div>
  <div id="hud"></div>
  <div id="help"></div>
  <div id="toast"></div>
  <div id="winner"><div class="a">🏆 VENCEDOR 🏆</div><div class="n" id="wname"></div></div>
</div>

<div class="ov" id="intro" style="display:flex;z-index:200;background:radial-gradient(#3a1470,#0a0618)">
  <div class="box" style="text-align:center;padding:40px 50px;min-width:min(620px,92vw)">
    <div style="font-family:'Lilita One',Impact,sans-serif;font-size:54px;color:#ffd23f;text-shadow:0 4px 0 #000a">ESCOLHA SABIAMENTE</div>
    <div style="font-size:22px;margin:8px 0 22px">Digite o canal da Twitch do streamer</div>
    <input id="canal" placeholder="nome do canal" style="font:inherit;font-size:30px;padding:14px 20px;border-radius:14px;border:3px solid #5b2bd8;background:#0d0726;color:#fff;width:100%;text-align:center" autofocus><br>
    <button id="bcon" style="font-size:30px;padding:16px 40px;margin-top:20px">▶ Conectar e começar</button><br>
    <button id="btest" style="font-size:16px;background:#333;margin-top:14px">Entrar sem conectar (teste)</button>
    <div style="margin-top:18px;font-size:18px">
      <div>📄 Perguntas: <b id="qchosen" style="color:#ffd23f">nenhum arquivo escolhido</b></div>
      <button id="qpick" style="font-size:20px;padding:10px 22px;margin-top:6px">📄 Escolher arquivo .txt</button>
      <input type="file" id="qfile" accept=".txt,text/plain,.TXT" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
      <div id="qmsg" style="font-size:15px;opacity:.85;margin-top:4px;min-height:20px"></div>
    </div>
    <div id="introst" style="margin-top:12px;font-size:18px;color:#ffd23f;min-height:24px"></div>
  </div>
</div>

<div id="panel">
  <span id="status">desconectado</span>
  <span class="sp"></span>
  <button id="bstart" class="go big">▶ Iniciar rodada</button>
  <button id="bfinish" class="warn big" style="display:none">👁 Ver a Resposta Correta</button>
  <button id="bback" class="gray" style="display:none">↩ Voltar às perguntas</button>
  <button id="bfinal">🎡 Roleta final</button>
  <span id="spinbox" style="display:none;align-items:center;gap:12px">
    <label><input type="checkbox" id="spinauto" checked> Auto</label><label>Giro: <input id="spinsec" type="range" min="2" max="30" value="2"> <b id="spinval">2s</b></label>
    <button id="bspin" class="go big">🎡 Girar</button>
  </span>
  <span class="sp"></span>
  <button id="bmute" title="Som ligado/desligado">🔊</button><button id="bmus" title="Música de fundo">🎵</button><input type="range" id="bvol" min="0" max="100" value="70" style="width:110px" title="Volume">
  <button id="breload" title="Escolha o arquivo .txt de novo (depois de editar)">🔄 Trocar/recarregar perguntas</button>
  <label><input type="checkbox" id="chkNoPick" checked> Sem voto = eliminado</label>
  <button id="breset">Nova partida</button>
  <span id="qinfo" style="font-size:16px;color:#bbb"></span>
</div>

<div class="ov" id="confirm"><div class="box"><div id="ctxt"></div><button id="cyes" style="font-size:24px">Sim</button><button id="cno" style="font-size:24px;background:#444">Não</button></div></div>
<script>
"use strict";
/* ============ DADOS DO GABARITO ============ */
const SLOTS=[
 {k:'skin',n:'Pele',t:'L'},{k:'hair',n:'Cabelo',t:'N'},{k:'head',n:'Cabeça',t:'L'},{k:'shirt',n:'Camisa',t:'N'},
 {k:'pants',n:'Calça',t:'L'},{k:'shoes',n:'Sapato',t:'N'},{k:'acc',n:'Acessório',t:'L'},
 {k:'d1',n:'Detalhe 1 (rosto)',t:'N'},{k:'d2',n:'Detalhe 2 (item)',t:'L'},{k:'d3',n:'Detalhe 3 (efeito)',t:'N'}];
const NAMES={
 skin:['Clara','Bege','Parda','Morena','Marrom','Escura','Verde','Azul','Roxa'],
 hair:['Curto preto','Longo castanho','Espetado loiro','Black power','Moicano azul','Coque rosa','Rabo ruivo','Chanel verde','Topete branco'],
 head:['Boné','Cartola','Gorro','Coroa','Capacete','Fones','Orelhas de gato','Chifres','Auréola'],
 shirt:['Vermelha','Azul','Verde','Amarela','Roxa','Laranja','Branca','Preta','Listrada'],
 pants:['Jeans','Preta','Cinza','Cáqui','Verde','Vermelha','Branca','Saia rosa','Saia xadrez'],
 shoes:['Branco','Preto','Vermelho','Azul','Verde','Amarelo','Rosa','Dourado','Roxo'],
 acc:['Óculos redondo','Óculos escuro','Máscara','Bigode','Gravata borboleta','Cachecol','Colar dourado','Capa','Gravata'],
 d1:['Brinco','Piercing','Tatuagem rosto','Bochechas','Cicatriz','Sardas','Lágrima','Estrela no rosto','Batom'],
 d2:['Mochila','Asinhas','Violão','Balão','Bandeirinha','Skate','Pet slime','Guarda-chuva','Estrela flutuante'],
 d3:['Brilhos','Corações','Notas musicais','Nuvem de chuva','Chamas nos pés','Aura dourada','Tatuagem no braço','Estrela no peito','Raios']};
const SKIN=['#ffdcb8','#f5c49a','#e0a373','#c68642','#8d5524','#5c3a1e','#8fd36a','#6db7ff','#c58bff'];
const HAIR=[['short','#1c1c1c'],['long','#6b3f1d'],['spiky','#f2d049'],['afro','#2b1a10'],['mohawk','#2f7dff'],['bun','#ff6fb5'],['pony','#d9531e'],['bob','#2fbf71'],['quiff','#e8e8ee']];
const SHIRT=['#e23b3b','#3b6fe2','#3bb35a','#f2d23a','#8a4be0','#f28a2e','#f2f2f2','#26262e','#3b6fe2'];
const PANTS=['#3a5fa8','#23232b','#8a8f99','#a58650','#2f7a45','#c23232','#e8e8e8','#ff7ac0','#c23232'];
const SHOES=['#f4f4f4','#1b1b1b','#e23b3b','#3b6fe2','#3bb35a','#f2d23a','#ff7ac0','#d9aa2b','#9b5cff'];

function parseCode(s){ // devolve array(10) com null onde não informado, ou null se inválido
  s=String(s).toUpperCase(); if(s.length<1||s.length>10) return null;
  const out=new Array(10).fill(null);
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(i%2===0){ if(!/^[A-J]$/.test(ch)) return null; out[i]= ch==='J'?0:ch.charCodeAt(0)-64; }
    else { if(!/^[0-9]$/.test(ch)) return null; out[i]=+ch; }
  }
  return out;
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function defaultLook(name){ // visual totalmente aleatório ao entrar
  const R=n=>1+Math.floor(Math.random()*n),M=(p,n)=>Math.random()<p?R(n):0;
  return [R(9),M(.92,9),M(.45,9),R(9),R(9),R(9),M(.4,9),M(.4,9),M(.35,9),M(.3,9)];
}
function codeOf(look){return look.map((v,i)=>SLOTS[i].t==='L'?(v===0?'J':String.fromCharCode(64+v)):String(v)).join('');}

/* ============ DESENHO LOWPOLY ============ */
function shade(hex,a){ // a: -1..1
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));
  return '#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1);
}
function poly(c,pts,fill,stroke){
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();
  c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke();}
}
function facetPoly(c,pts,col,cx,cy){ // polígono com facetas (leque a partir do centro)
  const n=pts.length;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n];
    const sh=(i%3===0?-0.16:i%3===1?0.12:0)+(i<n/2?0.06:-0.08);
    poly(c,[[cx,cy],a,b],shade(col,sh));
  }
}
function ngon(cx,cy,rx,ry,n,rot){const p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
function star(c,x,y,r,col){
  c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  c.closePath();c.fillStyle=col;c.fill();
}
const HY=-88; // centro da cabeça

function drawChar(c,L,t,ph,mv){
  const skin=SKIN[(L[0]||1)-1], hair=L[1]?HAIR[L[1]-1]:null, head=L[2], shirt=SHIRT[(L[3]||1)-1],
        pv=L[4], skirt=pv>=8, pants=(pv===0||skirt)?skin:PANTS[pv-1], shoes=SHOES[(L[5]||1)-1], acc=L[6], d1=L[7], d2=L[8], d3=L[9];
  const sw=mv?Math.sin(ph)*7:0, aw=mv?Math.sin(ph+Math.PI)*6:Math.sin(t*2)*1.2, bob=mv?Math.abs(Math.sin(ph))*-2.5:Math.sin(t*2)*0.8;
  // sombra
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(0,1,20,6,0,0,7);c.fill();
  if(d3===6){const g=c.createRadialGradient(0,-55,5,0,-55,60);g.addColorStop(0,'rgba(255,220,80,.55)');g.addColorStop(1,'rgba(255,220,80,0)');c.fillStyle=g;c.beginPath();c.arc(0,-55,60,0,7);c.fill();}
  if(d2===6){poly(c,[[-22,-3],[22,-3],[24,2],[-24,2]],'#c23232');c.fillStyle='#222';c.beginPath();c.arc(-14,4,3,0,7);c.arc(14,4,3,0,7);c.fill();}
  c.save();c.translate(0,bob);
  /* ---- camadas de trás ---- */
  if(acc===8){poly(c,[[-14,-72],[14,-72],[24,-12],[-24,-12]],'#b0182c');poly(c,[[0,-72],[14,-72],[24,-12],[0,-12]],'#8a1020');}
  if(d2===1){poly(c,[[-14,-72],[14,-72],[15,-42],[-15,-42]],'#d9822b');poly(c,[[0,-72],[14,-72],[15,-42],[0,-42]],'#b0651a');}
  if(d2===2){const f=Math.sin(t*8)*4;poly(c,[[-8,-68],[-34,-86+f],[-30,-60],[-8,-52]],'#f5f5ff');poly(c,[[8,-68],[34,-86+f],[30,-60],[8,-52]],'#dcdcf0');}
  if(d2===3){c.save();c.rotate(-0.5);poly(c,[[-3,-80],[3,-80],[3,-30],[-3,-30]],'#6b3f1d');poly(c,[[-11,-30],[11,-30],[13,-14],[0,-8],[-13,-14]],'#c98a43');poly(c,[[0,-30],[11,-30],[13,-14],[0,-8]],'#a56a28');c.fillStyle='#222';c.beginPath();c.arc(0,-20,3,0,7);c.fill();c.restore();}
  /* ---- pernas ---- */
  poly(c,[[-12,-40],[-1,-40],[-2+sw,-6],[-11+sw,-6]],pants);poly(c,[[-6,-40],[-1,-40],[-2+sw,-6],[-6+sw,-6]],shade(pants,-.15));
  poly(c,[[-13+sw,-6],[-1+sw,-6],[1+sw,0],[-15+sw,0]],shoes);
  poly(c,[[1,-40],[12,-40],[11-sw,-6],[2-sw,-6]],shade(pants,-.1));poly(c,[[6,-40],[12,-40],[11-sw,-6],[6-sw,-6]],shade(pants,-.25));
  poly(c,[[1-sw,-6],[13-sw,-6],[15-sw,0],[-1-sw,0]],shade(shoes,-.12));
  if(skirt){const sc=PANTS[pv-1];
    poly(c,[[-14,-42],[0,-42],[0,-20],[-21,-20]],shade(sc,.08));poly(c,[[0,-42],[14,-42],[21,-20],[0,-20]],shade(sc,-.2));
    poly(c,[[-14,-42],[0,-42],[-9,-31]],shade(sc,.2));
    if(pv===9){c.strokeStyle='#5a1020';c.lineWidth=2;for(const x of [-12,-4,4,12]){c.beginPath();c.moveTo(x*0.8,-42);c.lineTo(x*1.5,-20);c.stroke();}for(const y of [-37,-30,-24]){c.beginPath();c.moveTo(-18,y);c.lineTo(18,y);c.stroke();}}
    else{poly(c,[[-21,-22],[21,-22],[21,-20],[-21,-20]],shade(sc,.3));}
  }
  /* ---- tronco ---- */
  poly(c,[[-15,-72],[0,-72],[0,-40],[-13,-40]],shade(shirt,.08));
  poly(c,[[0,-72],[15,-72],[13,-40],[0,-40]],shade(shirt,-.18));
  poly(c,[[-15,-72],[0,-72],[-7,-56]],shade(shirt,.2));poly(c,[[0,-56],[13,-40],[0,-40]],shade(shirt,-.3));
  if(L[3]===9){for(let y=-66;y<-42;y+=8)poly(c,[[-14,y],[14,y],[14,y+3.5],[-14,y+3.5]],'#f4f4f4');}
  if(d3===8)star(c,0,-58,7,'#ffd23f');
  if(acc===9){poly(c,[[-3,-72],[3,-72],[5,-58],[0,-46],[-5,-58]],'#c23232');poly(c,[[0,-72],[3,-72],[5,-58],[0,-46]],'#8a1c1c');}
  /* ---- braços ---- */
  const ax=aw;
  poly(c,[[-15,-72],[-9,-72],[-14+ax,-46],[-21+ax,-46]],skin);poly(c,[[-15,-72],[-9,-72],[-11,-62],[-17,-62]],shirt);
  poly(c,[[9,-72],[15,-72],[21-ax,-46],[14-ax,-46]],shade(skin,-.15));poly(c,[[9,-72],[15,-72],[17,-62],[11,-62]],shade(shirt,-.2));
  if(d3===7){c.strokeStyle='#222';c.lineWidth=1.6;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-19+ax-i*0.5,-56+i*4);c.lineTo(-13+ax,-54+i*4);c.stroke();}}
  const hx=18-ax,hy=-46;
  if(d2===5){c.strokeStyle='#8a5a2b';c.lineWidth=2.5;c.beginPath();c.moveTo(hx+4,hy+4);c.lineTo(hx+4,hy-52);c.stroke();poly(c,[[hx+4,hy-52],[hx+26,hy-46+Math.sin(t*5)*3],[hx+4,hy-38]],'#e23b3b');}
  if(d2===4){c.strokeStyle='#ddd';c.lineWidth=1;c.beginPath();c.moveTo(hx,hy);c.quadraticCurveTo(hx+8,hy-50,hx+6+Math.sin(t*2)*4,hy-95);c.stroke();
    const bx=hx+6+Math.sin(t*2)*4,by=hy-110;c.fillStyle='#ff4d6d';c.beginPath();c.ellipse(bx,by,13,16,0,0,7);c.fill();c.fillStyle='#ff9aae';c.beginPath();c.ellipse(bx-4,by-5,4,6,0,0,7);c.fill();}
  if(d2===8){c.strokeStyle='#444';c.lineWidth=2;c.beginPath();c.moveTo(hx+2,hy+6);c.lineTo(hx+8,hy-62);c.stroke();poly(c,[[hx-20,hy-58],[hx+8,hy-82],[hx+36,hy-58],[hx+22,hy-62],[hx+8,hy-58],[hx-6,hy-62]],'#7a3be0');}
  if(d2===7){const s=1+Math.sin(t*6)*0.08;c.fillStyle='#5be07a';c.beginPath();c.ellipse(-34,-6,11,8*s,0,Math.PI,0);c.lineTo(-23,0);c.lineTo(-45,0);c.fill();c.fillStyle='#111';c.fillRect(-38,-9,3,3);c.fillRect(-32,-9,3,3);}
  /* ---- cabeça ---- */
  const hp=ngon(0,HY,17,18,8,Math.PI/8);
  // cabelo atrás
  if(hair){const hc=hair[1],st=hair[0];
    if(st==='long')poly(c,[[-19,HY-4],[19,HY-4],[21,-52],[-21,-52]],shade(hc,-.2));
    if(st==='bob')poly(c,[[-20,HY-6],[20,HY-6],[20,-72],[-20,-72]],shade(hc,-.2));
    if(st==='pony'){poly(c,[[14,HY-8],[28,HY-6+Math.sin(t*4)*3],[26,-62],[16,HY+4]],shade(hc,-.15));}
    if(st==='afro')facetPoly(c,ngon(0,HY-6,28,28,10,0.2),hc,0,HY-6);
  }

function parseQs(txt){txt=String(txt).replace(/^\uFEFF/,'');
  const out=[];
  txt.split(/\r?\n/).forEach(l=>{
    if(l.trim().startsWith('#'))return;const p=l.split('|').map(s=>s.trim()); if(p.length<4||!p[0])return;
    const opts=p.slice(1,4); let c=-1;
    opts.forEach((o,i)=>{if(o.startsWith('*')){c=i;opts[i]=o.slice(1).trim();}});
    if(c<0||opts.some(o=>!o))return;
    out.push({q:p[0],opts,correct:c+1});
  });
  return out;
}
function loadQs(text,src){let q=parseQs(text==null?'':text);if(!q.length){q=parseQs(DEF_Q);src='exemplo (sem perguntas.txt)';}G.qs=q;G.pool=[];G.qSrc=src||'exemplo';const e=$('qinfo');if(e)e.textContent=q.length+' perguntas — '+G.qSrc;}
function nextQ(){
  if(!G.pool.length){G.pool=G.qs.map((_,i)=>i);if(G.optShuffle)for(let i=G.pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.pool[i],G.pool[j]]=[G.pool[j],G.pool[i]];}}
  return G.qs[G.pool.shift()];
}

/* ============ JOGADORES ============ */
function join(key,name){
  if(G.players.has(key))return;
  if(G.phase!=='lobby'){return;}
  if(G.players.size>=1000)return;
  const p={key,name,look:defaultLook(key),x:200+Math.random()*1520,y:1150,tx:960,ty:850,s:.6,ts:.6,ph:Math.random()*6,alive:true,choice:0,state:'idle',vx:0,vy:0,rot:0,vr:0,slot:-1,idx:G.players.size,bot:false,pop:0,moving:false};
  G.players.set(key,p);
}
function setLook(p,arr){
  for(let i=0;i<10;i++)if(arr[i]!==null)p.look[i]=arr[i];
  if(!p.look[0])p.look[0]=defaultLook(p.key)[0];
  p.pop=1;
}
function vote(p,n){
  if(!p||!p.alive)return;
  if(G.phase==='question'){ if(n>=1&&n<=3){if(p.choice!==n)SND.play('vote',60);p.choice=n;} }
  else if(G.phase==='final'){
    const N=G.slots.length; if(n<1||n>N)return;
    if(G.slots[n-1]&&G.slots[n-1]!==p)return;
    if(p.slot>=0)G.slots[p.slot]=null;
    p.slot=n-1;G.slots[n-1]=p;
  }
}
const lastCmd={};
function handleChat(key,name,msg){
  // SOMENTE comandos pré-programados são interpretados; todo o resto é ignorado.
  const now=performance.now(); if(now-(lastCmd[key]||0)<250)return; 
  const w=String(msg).trim().split(/\s+/)[0]||'';
  if(/^!jogo$/i.test(w)){lastCmd[key]=now;join(key,name);return;}
  const m=/^#([A-Za-z0-9]{1,10})$/.exec(w); if(!m)return;
  lastCmd[key]=now;
  const p=G.players.get(key); if(!p)return;
  if(/^[0-9]{1,3}$/.test(m[1])){vote(p,parseInt(m[1],10));return;}
  const arr=parseCode(m[1]); if(arr)setLook(p,arr);
}

/* ============ TWITCH (chat público, sem login) ============ */
let ws=null,wantConn=false,rcT=0;
function setStatus(t){$('status').textContent=t;const e=$('introst');if(e)e.textContent=t;}
function connect(ch){
  ch=String(ch||'').trim().replace(/^#/,'').toLowerCase();
  if(!/^[a-z0-9_]{3,25}$/.test(ch)){setStatus('nome de canal inválido');return;}
  store('tw1_canal',ch);wantConn=true;
  try{if(ws){ws.onclose=null;ws.close();}}catch(e){}
  setStatus('conectando em #'+ch+'...');
  ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(10000+Math.random()*80000));ws.send('JOIN #'+ch);};
  ws.onmessage=ev=>{
    String(ev.data).split('\r\n').forEach(line=>{
      if(!line)return;
      if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return;}
      if(line.indexOf(' JOIN #')>0&&/ JOIN #/.test(line)&&line.indexOf('justinfan')>=0){setStatus('✔ conectado ao chat de '+ch);return;}
      const m=/^(?:@(\S+) )?:([^!\s]+)![^\s]+ PRIVMSG #\S+ :(.*)$/.exec(line); if(!m)return;
      let disp=m[2];const tg=m[1]||'';const d=/(?:^|;)display-name=([^;]*)/.exec(tg);if(d&&d[1])disp=d[1].replace(/\\s/g,' ');
      handleChat(m[2].toLowerCase(),disp.slice(0,20),m[3]);
    });
  };
  ws.onerror=()=>setStatus('erro de conexão');
  ws.onclose=()=>{if(wantConn){setStatus('reconectando...');clearTimeout(rcT);rcT=setTimeout(()=>connect(ch),3000);}else setStatus('desconectado');};
}

function launch(p){

  p.vx=(p.x-960)*0.9+(Math.random()-.5)*500;p.vy=-900-Math.random()*500;p.vr=(Math.random()-.5)*14;

function startRound(){
  if(!(G.phase==='lobby'||G.phase==='between'))return;
  if(aliveList().length<2){toast('Precisa de pelo menos 2 jogadores!');return;}
  G.cur=nextQ();G.round++;G.correct=G.cur.correct;
  aliveList().forEach(p=>p.choice=0);
  G.noRight=false;G.shut=[0,0,0];SND.play('open',0);SND.mode('tense');G.phase='opening';G.openT=0;G.launched=false;G.returned=false;

  if(G.phase!=='question')return;
  ask('Posso apertar?',()=>{if(G.phase!=='question')return;SND.play('lock',0);SND.mode('silent');G.beat=false;G.dinged=false;G.phase='locked';G.lockT=0;G.launched=false;G.returned=false;});
}
function askFinal(){ask('Quer mesmo ir para a Roleta Final agora?',startFinal);}
function startFinal(){
  if(!(G.phase==='lobby'||G.phase==='between'||G.phase==='final'||G.phase==='spinning'))return;
  const al=aliveList(); if(al.length<2){toast('Precisa de pelo menos 2 jogadores!');return;}
  G.phase='final';G.slots=new Array(al.length).fill(null);al.forEach(p=>{p.slot=-1;p.choice=0;});
  G.cur=null;G.elim=new Set();G.R=Math.random()*6.28;SND.mode('drama');SND.play('drum',0);
}
// giro automático: muitos jogadores = 2s; poucos = mais tempo, até 10s com 2 jogadores
function autoDur(n){const t=1-Math.log(Math.max(2,n)/2)/Math.log(25);return 2+8*Math.max(0,Math.min(1,t));}
// com mais de 20 na roleta, cada rodada elimina vários (no mínimo 5): vários giros seguidos
function elimCount(n){return n>20?Math.min(n-1,Math.max(5,Math.ceil(n*0.25))):1;}
function startSpin(){
  if(G.phase!=='final')return;
  const al=aliveList(),N=G.slots.length;
  const free=[];G.slots.forEach((s,i)=>{if(!s)free.push(i);});
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]];}
  al.forEach(p=>{if(p.slot<0){const i=free.pop();p.slot=i;G.slots[i]=p;}});
  G.spinDurBase=$('spinauto').checked?autoDur(N):Math.max(2,Math.min(30,parseFloat($("spinsec").value)||2));
  G.spinK=elimCount(N);G.spinsLeft=G.spinK;G.elim=new Set();
  doSpin();
}
function doSpin(){
  const N=G.slots.length,c=[];for(let i=0;i<N;i++)if(!G.elim.has(i))c.push(i);
  G.spinDur=G.spinDurBase;G.spinT=0;G.spinWin=c[Math.floor(Math.random()*c.length)];
  const seg=2*Math.PI/N,center=(G.spinWin+.5)*seg,extra=(Math.random()-.5)*seg*.7;
  const tgt=-Math.PI/2-center-extra,rot=3+G.spinDur*.8;
  G.R0=G.R;const k=Math.ceil((G.R0+2*Math.PI*rot-tgt)/(2*Math.PI));G.Rf=tgt+2*Math.PI*k;
  G.phase='spinning';G.spinStage=0;G.lastSeg=-1;SND.mode('silent');
}
function backToQuestions(){
  if(G.phase!=='final')return;
  G.slots=[];aliveList().forEach(p=>p.slot=-1);
  G.phase=G.round>0?'between':'lobby';SND.mode('calm');
}
function setWinner(p){
  G.winner=p;G.phase='win';G.winT=0;SND.mode('silent');SND.play('win',0);
  $('wname').textContent=p.name;$('winner').style.display='flex';

  if(clear)G.players.clear();
  G.players.forEach(p=>{p.alive=true;p.state='idle';p.choice=0;p.slot=-1;p.rot=0;p.vx=p.vy=0;if(p.y>1100||p.y<0){p.x=200+Math.random()*1520;p.y=1150;}});
  G.spinAsked=false;  SND.mode('calm');G.phase='lobby';G.cur=null;G.winner=null;G.round=0;G.slots=[];$('winner').style.display='none';
}
function addBots(n){
  if(G.phase!=='lobby'){toast('Bots só entram no lobby');return;}

    const nm='Bot'+Math.floor(Math.random()*900+100);join(nm.toLowerCase(),nm);

function botAI(dt){

    p.bt=(p.bt===undefined?Math.random()*4:p.bt)-dt;
    if(p.bt>0)return;p.bt=1+Math.random()*5;
    if(G.phase==='question'&&Math.random()<.9)vote(p,1+Math.floor(Math.random()*3));

/* progresso por frame da lógica de fases */
function stepPhase(dt){
  G.t+=dt;
  if(G.phase==='opening'){G.openT+=dt;for(let i=0;i<3;i++)if(!G.shut[i]&&G.openT>i*.35){G.shut[i]=1;SND.play('shutter',0);}if(G.openT>2.2)G.phase='question';}
  else if(G.phase==='locked'){G.lockT+=dt;if(!G.beat&&G.lockT>.9){G.beat=true;SND.play('beat',0);}if(G.lockT>=2){G.phase='reveal';G.revealT=0;}}
  else if(G.phase==='reveal'){
    G.revealT+=dt;
    if(!G.dinged&&G.revealT>.2){G.dinged=true;SND.play('ding',0);}
    if(!G.launched&&G.revealT>1.2){
      G.launched=true;const al=aliveList();
      const right=al.filter(p=>p.choice===G.correct);G.noRight=!right.length;SND.play(G.noRight?'sad':'launch',0);
      if(!right.length)toast('Ninguém acertou! Todo mundo continua 😅',4);
      else al.forEach(p=>{if(p.choice!==G.correct&&(p.choice!==0||G.optNoPick))launch(p);});
    }
    if(!G.returned&&G.revealT>4.0){G.returned=true;SND.play('ok',0);aliveList().forEach(p=>p.choice=0);}
    if(G.returned&&G.revealT>6.0){
      const al=aliveList();
      SND.mode('calm');if(al.length===1)setWinner(al[0]);else if(al.length===0)G.phase='lobby';else G.phase='between';
    }
  }
  else if(G.phase==='spinning'){
    if(G.spinStage===0){
      G.spinT+=dt;const x=Math.min(1,G.spinT/G.spinDur);G.R=G.R0+(G.Rf-G.R0)*(1-Math.pow(1-x,4));
      {const N=G.slots.length,sg=2*Math.PI/N,loc=(((-Math.PI/2-G.R)%(2*Math.PI))+2*Math.PI)%(2*Math.PI),si=Math.floor(loc/sg);if(si!==G.lastSeg){G.lastSeg=si;SND.play('spin',22);}}
      if(x>=1){G.spinStage=1;G.spinT=0;SND.play('cymbal',0);}
    }else if(G.spinStage===1){
      G.spinT+=dt;if(G.spinT>(G.spinsLeft>1?1.0:1.8)){const v=G.slots[G.spinWin];if(v){v.x=960;v.y=640;v.s=1;launch(v);v.vy=-1100;}G.elim.add(G.spinWin);G.spinsLeft--;SND.play('elim',0);G.spinStage=2;G.spinT=0;}
    }else if(G.spinStage===2){
      G.spinT+=dt;if(G.spinsLeft>0){if(G.spinT>.9)doSpin();}else if(G.spinT>2.6){const al=aliveList();if(al.length===1)setWinner(al[0]);else startFinal();}
    }
  }
  else if(G.phase==='win'){
    G.winT+=dt;
    if(Math.random()<.9)for(let i=0;i<4;i++)G.conf.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*160,vy:150+Math.random()*250,r:Math.random()*6,vr:(Math.random()-.5)*10,c:`hsl(${Math.random()*360},90%,60%)`,w:8+Math.random()*10});
  }
  botAI(dt);
}

/* ============ SONS (sintetizados, sem arquivos) ============ */
const SND=(()=>{
  let ctx=null,master=null,sfx=null,mus=null,vol=.7,muted=false,musicOn=true,mode='calm',step=0,nextT=0,timer=null;
  const last={};
  function ok(name,gap){const n=performance.now();if(n-(last[name]||0)<gap)return false;last[name]=n;return true;}
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=ctx.createGain();master.gain.value=muted?0:vol;master.connect(ctx.destination);
    sfx=ctx.createGain();sfx.gain.value=1;sfx.connect(master);
    mus=ctx.createGain();mus.gain.value=musicOn?.16:0;mus.connect(master);
    nextT=ctx.currentTime+.1;timer=setInterval(sched,80);
    
  }
  function tone(f,t,d,type,v,f2,dest){
    if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.3,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+d+.05);
  }
  let nbuf=null;
  function noise(t,d,v,f0,f1,type,dest){
    if(!ctx)return;if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;const f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+d);
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.03,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(dest||sfx);s.start(t);s.stop(t+d+.05);
  }
  const N=(semi)=>440*Math.pow(2,semi/12);
  const fx={
    join(t){tone(520,t,.12,'sine',.18,880);},
    look(t){tone(900,t,.07,'triangle',.12,1300);},
    vote(t){tone(700+Math.random()*200,t,.04,'square',.05);},
    click(t){tone(600,t,.05,'square',.1);},
    open(t){noise(t,.7,.25,300,3000);[0,4,7,12].forEach((s,i)=>tone(N(s-12),t+.1+i*.09,.2,'triangle',.18));},
    shutter(t){noise(t,.35,.22,1800,400);tone(160,t+.25,.15,'sine',.25,70);},
    tick(t){tone(1100,t,.05,'square',.12);},
    lock(t){tone(110,t,.6,'sine',.5,40);noise(t,.5,.15,200,120,'lowpass');},
    beat(t){tone(70,t,.14,'sine',.45,45);tone(70,t+.2,.14,'sine',.35,45);},
    ding(t){[0,7,12].forEach((s,i)=>{tone(N(s+3),t+i*.07,.9,'sine',.22);tone(N(s+15),t+i*.07,.5,'triangle',.08);});},
    launch(t){noise(t,.6,.3,3000,300,'bandpass');tone(300,t,.5,'sawtooth',.14,900);tone(500,t+.15,.6,'square',.07,100);},
    elim(t){tone(500,t,.5,'sawtooth',.12,80);noise(t,.4,.12,2500,300);},
    sad(t){[0,-1,-2,-4].forEach((s,i)=>tone(N(s-10),t+i*.28,i===3?.8:.26,'sawtooth',.16,N(s-10)*(i===3?.8:1)));},
    ok(t){[0,4,7].forEach((s,i)=>tone(N(s),t+i*.08,.18,'triangle',.15));},
    drum(t){for(let i=0;i<10;i++){noise(t+i*.09,.08,.18+i*.02,400,200,'lowpass');tone(120,t+i*.09,.08,'sine',.2+i*.02,70);}},
    spin(t){tone(1300+Math.random()*150,t,.025,'square',.1);},
    cymbal(t){noise(t,1.2,.3,6000,3000,'highpass');tone(90,t,.5,'sine',.4,45);},
    win(t){[0,4,7,12,7,12,16].forEach((s,i)=>{tone(N(s),t+i*.14,i===6?1.2:.2,'square',.1);tone(N(s-12),t+i*.14,i===6?1.2:.2,'triangle',.18);});
      for(let k=0;k<30;k++)noise(t+.4+k*.1,.12,.12+Math.random()*.1,1800+Math.random()*2000,null,'bandpass');},
  };
  function play(name,gap){
    if(!ctx||!fx[name])return;if(ok(name,gap===undefined?30:gap))fx[name](ctx.currentTime+.01);
  }
  /* música gerativa: acordes, tonalidade e melodia mudam sozinhos, então não vira loop repetitivo */
  const PAT={calm:{bpm:104,wave:'triangle',sc:[0,2,4,7,9],prog:[[0,9,5,7],[0,5,7,0],[0,7,9,5],[9,5,0,7],[0,4,5,7]]},
             tense:{bpm:132,wave:'square',sc:[0,2,3,5,7,8,10],prog:[[0,8,5,7],[0,5,8,7],[0,10,8,7],[0,3,8,7]]},
             drama:{bpm:150,wave:'sawtooth',sc:[0,1,3,5,7,8,10],prog:[[0,1,0,10],[0,8,1,0],[0,5,1,0],[0,3,1,7]]}};
  const KEYS=[-5,-3,-2,0,2,3,5];

        bar++;

        const b4=bar%4;
        if(b4===1||!motif.length)motif=newMotif(p);else if(b4===3||b4===2)motif=mutate(motif,p);

      if(i===0){[0,third,7].forEach(s=>tone(N(root-12+s),nextT,dur*7.5,'sine',.07,0,mus));}

      let n=motif[i];
      if(n!==null&&n!==undefined){
        if(i===0||i===4){n=[0,third,7,12][Math.floor(Math.random()*4)];}
        tone(N(key+n),nextT,dur*(Math.random()<.3?1.8:.9),p.wave,mode==='calm'?.13:.11,0,mus);
      }
      // percussão leve
      if(mode!=='calm'&&(i===0||i===4))tone(110,nextT,.12,'sine',.5,50,mus);
      if(mode==='drama'&&i%2===1)noise(nextT,.05,.08,300,null,'lowpass',mus);
      if(i%2===0)noise(nextT,.035,mode==='calm'?.035:.06,7000,null,'highpass',mus);
      nextT+=dur;step++;
    }
  }
  return{
    init,play,
    mode(m){mode=m;},
    setVol(v){vol=v;if(master)master.gain.value=muted?0:vol;},
    setMuted(m){muted=m;if(master)master.gain.value=m?0:vol;},
    setMusic(on){musicOn=on;if(mus)mus.gain.value=on?.16:0;},
    get ready(){return !!ctx;}
  };
})();

  const skin=SKIN[(L[0]||1)-1],hair=L[1]?HAIR[L[1]-1][1]:null,shirt=SHIRT[(L[3]||1)-1],pants=(L[4]===0||L[4]>=8)?skin:PANTS[L[4]-1],sw=mv?Math.sin(ph)*6:0;
  c.fillStyle='rgba(0,0,0,.28)';c.fillRect(-16,-2,32,5);
  c.fillStyle=pants;c.fillRect(-12,-40,11,40+sw*0.1);c.fillRect(1,-40,11,40-sw*0.1);
  c.fillStyle=shirt;c.fillRect(-15,-72,30,32);if(L[4]>=8){c.fillStyle=PANTS[L[4]-1];c.fillRect(-20,-42,40,22);}
  c.fillStyle=skin;c.fillRect(-17,-106,34,36);
  if(hair){c.fillStyle=hair;c.fillRect(-18,-108,36,14);}
  c.fillStyle='#1b1b22';c.fillRect(-8,-90,4,5);c.fillRect(4,-90,4,5);
}
function layout(){
  const al=[...G.players.values()].filter(p=>p.alive).sort((a,b)=>a.idx-b.idx);
  const g=[[],[],[],[]];
  const fin=(G.phase==='final'||G.phase==='spinning'),pick=(G.phase==='question'||G.phase==='locked'||G.phase==='reveal'||G.phase==='opening');
  al.forEach(p=>g[pick?p.choice:0].push(p));
  const place=(list,cx,cy,Rx,Ry,sm)=>{const n=list.length;if(!n)return;const sp=Math.sqrt(Math.PI*Rx*Ry/n),s=clamp(sp/62,.32,sm);
    list.forEach((p,i)=>{const r=Math.sqrt((i+.5)/n),a=i*2.39996;p.tx=cx+Rx*r*Math.cos(a);p.ty=cy+Ry*r*Math.sin(a);p.ts=s;});};
  if(fin)place(g[0],960,1000,860,34,.42);
  else place(g[0],960,830,800,125,1);
  for(let i=1;i<=3;i++)place(g[i],ZX[i-1],ZY+6,185,40,.85);
}
function updatePlayers(dt){
  layout();
  G.players.forEach(p=>{
    if(p.state==='out')return;
    if(p.pop>0)p.pop=Math.max(0,p.pop-dt*1.5);
    if(p.state==='fly'){p.vy+=1900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.moving=false;if(p.y>1500||p.x<-300||p.x>2220)p.state='out';return;}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    p.moving=d>3;
    if(p.moving){const st=Math.min(d,(260+p.s*120)*dt);p.x+=dx/d*st;p.y+=dy/d*st;p.ph+=dt*14;}
    p.s+=(p.ts-p.s)*Math.min(1,dt*4);
  });
}
function render(){
  const c=ctx;c.clearRect(0,0,W,H);if(!bg)buildBg();c.drawImage(bg,0,0);
  // holofotes
  c.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const x=300+i*440,a=Math.sin(G.t*.8+i*1.7)*.25;c.save();c.translate(x,0);c.rotate(a);
    const g=c.createLinearGradient(0,0,0,900);g.addColorStop(0,`hsla(${i*80+G.t*20},90%,60%,.30)`);g.addColorStop(1,'#0000');c.fillStyle=g;c.beginPath();c.moveTo(-14,0);c.lineTo(14,0);c.lineTo(130,900);c.lineTo(-130,900);c.fill();c.restore();}
  c.globalCompositeOperation='source-over';
  const ph=G.phase;
  if(ph==='final'||ph==='spinning')drawWheel();
  else if(ph!=='win')drawPlatforms();
  // personagens
  const vis=[...G.players.values()].filter(p=>p.state!=='out'&&(p.alive||p.state==='fly'));
  if(ph==='win'&&G.winner){
    const w=G.winner;c.save();c.translate(960,985);const sc=2.6+Math.sin(G.t*4)*.06;c.scale(sc,sc);drawChar(c,w.look,G.t,0,false);c.restore();
  }else{
    vis.sort((a,b)=>a.y-b.y);
    vis.forEach(p=>{
      const sc=p.s*(.72+.5*clamp((p.y-420)/640,0,1.3))*(1+.25*Math.sin(p.pop*Math.PI));
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(sc,sc);if(sc<.5)drawLite(c,p.look,p.ph,p.moving);else drawChar(c,p.look,G.t+p.ph,p.ph,p.moving);c.restore();
    });
    vis.forEach(p=>{
      const sc=p.s*(.72+.5*clamp((p.y-420)/640,0,1.3));if(sc<.42||p.state==='fly'&&false)return;
      const fs=Math.max(12,Math.round(19*sc));c.font=`${fs}px ${FONT}`;c.textAlign='center';c.textBaseline='alphabetic';
      c.lineWidth=5;c.strokeStyle='#000c';c.fillStyle='#fff';
      const ty=p.y-130*sc*(1+0)+p.rot*0;c.save();if(p.state==='fly'){c.translate(p.x,p.y);c.rotate(p.rot);c.strokeText(p.name,0,-130*sc);c.fillText(p.name,0,-130*sc);}else{c.strokeText(p.name,p.x,ty);c.fillText(p.name,p.x,ty);}c.restore();
    });
  }
  // confete
  G.conf.forEach(f=>{c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillStyle=f.c;c.fillRect(-f.w/2,-f.w/4,f.w,f.w/2);c.restore();});
}
function stepConf(dt){G.conf.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;});G.conf=G.conf.filter(f=>f.y<H+30);}

/* ============ UI ============ */
let lastQ='',lastHelp='';
function updateUI(){
  const ph=G.phase,all=G.players.size,al=aliveList().length;
  let q='',tag='ESCOLHA SABIAMENTE',help='';
  if(ph==='lobby'){q='Digite !jogo no chat para entrar!';help='<b>!jogo</b> entra no jogo<br><b>#A1D6F8B1</b> personaliza o bonequinho (use o Gerador de Personagem)';}
  else if(ph==='opening'||ph==='question'||ph==='locked'||ph==='reveal'){q=G.cur?G.cur.q:'';tag=ph==='locked'?'🔒 RESPOSTAS TRAVADAS':'RODADA '+G.round;help=ph==='question'?'Escolha <b>#1</b> <b>#2</b> ou <b>#3</b>':'';}
  else if(ph==='between'){q='Prepare-se para a próxima rodada!';tag='RODADA '+G.round+' CONCLUÍDA';help='Quem entrou na plataforma errada caiu fora!';}
  else if(ph==='final'){const K=elimCount(G.slots.length);q='ROLETA FINAL! Escolha seu número'+(K>1?' — serão eliminados '+K:'');tag='🎡 SOBRARAM '+al;help='Digite <b>#1</b> até <b>#'+G.slots.length+'</b> para escolher sua casa.<br>Quem não escolher recebe uma casa sorteada.';}
  else if(ph==='spinning'){q=G.spinK>1?'Eliminando '+G.spinK+' jogadores — faltam '+G.spinsLeft:'Girando...';tag='🎡 ROLETA FINAL';help='';}
  else if(ph==='win'){q='Temos um vencedor!';tag='🏆 FIM DE JOGO';help='';}
  if(q!==lastQ+'|'+tag){lastQ=q+'|'+tag;$('qtxt').textContent=q;$('qtag').textContent=tag;
    const L=q.length;$('qtxt').style.fontSize=(L>110?36:L>80?44:L>50?50:58)+'px';}
  if(help!==lastHelp){lastHelp=help;$('help').innerHTML=help;$('help').style.display=help?'block':'none';}
  $('hud').innerHTML=(ph==='final'||ph==='spinning'?'<b>'+al+'</b> restantes':'Jogando: <b>'+al+'</b> / '+all);
  const sh=(id,v)=>{const e=$(id),d=v?(id==='spinbox'?'flex':'inline-block'):'none';if(e.style.display!==d)e.style.display=d;};
  sh('bstart',ph==='lobby'||ph==='between');
  sh('bfinish',ph==='opening'||ph==='question');
  $('bfinish').disabled=ph!=='question';
  sh('bfinal',ph==='lobby'||ph==='between');
  sh('spinbox',ph==='final');
  sh('bback',ph==='final');
  if(ph==='final'){const au=$('spinauto').checked;$('spinsec').disabled=au;$('spinval').textContent=au?autoDur(G.slots.length).toFixed(1)+'s (auto)':$('spinsec').value+'s';}
}

/* escala da tela */
function fit(){
  const pn=$('panel'),ph=pn.classList.contains('hide')?0:pn.offsetHeight;
  const k=Math.min(innerWidth/W,(innerHeight-ph)/H);
  const w=$('wrap');w.style.transform=`translate(${(innerWidth-W*k)/2}px,${(innerHeight-ph-H*k)/2}px) scale(${k})`;
}
addEventListener('resize',fit);

/* ============ WIRING ============ */
const startIntro=()=>{const v=$('canal').value.trim().replace(/^#/,'');if(!/^[A-Za-z0-9_]{3,25}$/.test(v)){$('introst').textContent='Nome de canal inválido';return;}stored(true);connect(v);$('intro').style.display='none';};
$('bcon').onclick=startIntro;
$('btest').onclick=()=>{stored(true);$('intro').style.display='none';setStatus('modo teste (sem chat)');};
$('canal').addEventListener('keydown',e=>{if(e.key==='Enter')startIntro();});
$('bstart').onclick=startRound;
$('bfinish').onclick=finishRound;
$('bfinal').onclick=askFinal;
$('bspin').onclick=()=>{if(G.spinAsked){startSpin();return;}ask('Posso girar a roleta?',()=>{G.spinAsked=true;startSpin();});};
$('breset').onclick=e=>ask(e.ctrlKey?'Apagar TODOS os jogadores?':'Nova partida (todos voltam)?',()=>resetGame(e.ctrlKey));
$('breset').title='Ctrl+clique apaga todos os jogadores';
$('spinsec').oninput=()=>{store('tw1_spin2',$('spinsec').value);};
$('spinauto').onchange=()=>store('tw1_spinauto',$('spinauto').checked?'1':'0');
let sMute=store('tw1_mute')==='1',sMus=false,sVol=parseFloat(store('tw1_vol')||'70');
function sUI(){$('bmute').textContent=sMute?'🔇':'🔊';$('bmus').style.opacity=sMus?1:.4;SND.setMusic(sMus);$('bvol').value=sVol;SND.setMuted(sMute);SND.setVol(sVol/100);}
$('bmus').onclick=()=>{sMus=!sMus;sUI();};
$('bmute').onclick=()=>{sMute=!sMute;store('tw1_mute',sMute?'1':'0');sUI();};
$('bvol').oninput=()=>{sVol=+$('bvol').value;store('tw1_vol',String(sVol));sUI();};
sUI();
/* ---- perguntas: escolher o arquivo .txt (seletor de arquivos comum, funciona em qualquer navegador) ---- */
function chosen(name,n){G.qChosen=true;$('qchosen').textContent='✔ '+name+' ('+n+' perguntas)';$('qchosen').style.color='#7dffb0';$('qmsg').textContent='';$('qmsg').style.color='';}
function qerr(msg){$('qchosen').textContent='nenhum arquivo escolhido';$('qchosen').style.color='#ffd23f';const e=$('qmsg');e.style.color='#ff9a9a';e.style.opacity=1;e.textContent='⚠ '+msg;toast(msg,5);}
function applyText(t,name,quiet){
  const n=parseQs(t).length;
  if(!n){qerr(name+': nenhuma pergunta válida encontrada. Formato: Pergunta | resposta 1 | *resposta certa | resposta 3');return false;}
  loadQs(t,name);chosen(name,n);if(!quiet)toast('✔ '+n+' perguntas carregadas',3);return true;
}
function pickFile(){$('qfile').click();}
$('qfile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  $('qchosen').textContent='lendo '+f.name+'...';$('qchosen').style.color='#ffd23f';
  const r=new FileReader();
  r.onload=()=>applyText(String(r.result),f.name);
  r.onerror=()=>qerr('Não consegui ler o arquivo.');
  r.readAsText(f,'utf-8');
  e.target.value='';
});
$('qpick').onclick=pickFile;
// depois de editar o arquivo, escolha-o de novo para recarregar
$('breload').onclick=pickFile;
// servidor http com perguntas.txt ao lado: carrega sozinho
(async()=>{try{const r=await fetch('perguntas.txt',{cache:'no-store'});if(r.ok)applyText(await r.text(),'perguntas.txt',true);}catch(e){}})();
function stored(){}
$('bback').onclick=backToQuestions;
$('chkNoPick').onchange=()=>{G.optNoPick=$('chkNoPick').checked;store('tw1_np',G.optNoPick?'1':'0');};
addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.shiftKey&&(e.key==='b'||e.key==='B')){e.preventDefault();addBots(20);return;}
  if(/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;
  if(e.key==='h'||e.key==='H'){$('panel').classList.toggle('hide');fit();}
});

/* ============ LOOP ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  stepPhase(dt);updatePlayers(dt);stepConf(dt);render();updateUI();
  requestAnimationFrame(frame);
}
function init(){
  const q=new URLSearchParams(location.search);
  G.optNoPick=store('tw1_np')!=='0';G.optShuffle=store('tw1_sh')!=='0';
  $('chkNoPick').checked=G.optNoPick;const sv=store('tw1_spin2');if(sv)$('spinsec').value=sv;$('spinauto').checked=store('tw1_spinauto')!=='0';loadQs();fit();
  const ch=q.get('canal')||store('tw1_canal')||'';$('canal').value=ch;
  if(q.get('painel')==='0'){$('panel').classList.add('hide');fit();}
  if(ch&&q.get('auto')==='1'){stored(false);connect(ch);$('intro').style.display='none';}else $('canal').focus();
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{bg=null;});
  requestAnimationFrame(frame);
}
init();
</script>
