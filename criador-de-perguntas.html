<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criador de Perguntas — Escolha Sabiamente</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(#3a1470,#0a0618);min-height:100vh;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:#fff;padding:14px 14px 120px}
h1{font-family:'Lilita One',Impact,sans-serif;color:#ffd23f;font-size:36px;text-shadow:0 3px 0 #000a;text-align:center}
.sub{text-align:center;opacity:.85;font-size:18px;margin-bottom:12px}
.bar{max-width:1000px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-weight:800;font-size:20px;padding:12px 22px;border-radius:12px;border:0;background:#5b2bd8;color:#fff;cursor:pointer}
button:hover{background:#7a4dff}button.go{background:#13a34a}button.gray{background:#444}button.red{background:#c0301c}
button.sm{font-size:16px;padding:6px 12px}
input[type=text]{font:inherit;font-size:20px;padding:10px 14px;border-radius:10px;border:3px solid #5b2bd8;background:#0d0726;color:#fff;width:100%}
input[type=text]:focus{border-color:#ffd23f;outline:0}
#list{max-width:1000px;margin:0 auto}
.q{background:#1a0f45;border:3px solid #5b2bd8;border-radius:16px;padding:12px;margin-bottom:12px}
.q.bad{border-color:#ff8a3d}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qn{font-family:'Lilita One',Impact,sans-serif;font-size:26px;color:#ffd23f;min-width:44px}
.qh .tools{display:flex;gap:6px}
.ans{display:flex;align-items:center;gap:10px;margin-top:8px}
.ans input[type=radio]{width:26px;height:26px;accent-color:#13a34a;flex:none}
.ans .lbl{font-family:'Lilita One',Impact,sans-serif;font-size:24px;width:34px;text-align:center;color:#1a0f45;border-radius:8px;flex:none}
.ans.ok input[type=text]{border-color:#13a34a;background:#0d2a1a}
.ans img{height:44px;max-width:80px;object-fit:contain;border-radius:6px;background:#fff}
.warn{color:#ffb070;font-size:16px;margin-top:6px}
.hint{opacity:.75;font-size:15px;margin-top:6px}
#foot{position:fixed;left:0;right:0;bottom:0;background:#120a30f2;border-top:3px solid #ffd23f;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;z-index:5}
#msg{color:#7dffb0;font-size:18px;min-width:200px}
#txt{display:none;max-width:1000px;margin:0 auto 12px;width:100%;height:240px;background:#0d0726;color:#fff;border:2px solid #5b2bd8;border-radius:10px;padding:10px;font:14px/1.4 monospace}
</style>
</head>
<body>
<h1>📝 Criador de Perguntas</h1>
<div class="sub">Escreva as perguntas, marque a resposta certa e salve o arquivo .txt na mesma pasta do jogo</div>
<div class="bar">
  <button id="badd" class="go">+ Nova pergunta</button>
  <button id="bopen">📂 Abrir .txt para editar</button>
  <button id="bview" class="gray">👁 Ver texto</button>
  <button id="bclear" class="red">🗑 Começar do zero</button>
  <input type="file" id="fopen" accept=".txt,text/plain" style="display:none">
</div>
<textarea id="txt" readonly></textarea>
<div id="list"></div>
<div id="foot">
  <span id="cnt" style="font-size:18px"></span>
  <input type="text" id="fname" value="perguntas" style="width:210px" title="nome do arquivo"><span>.txt</span>
  <button id="bsave" class="go">💾 Salvar .txt</button>
  <span id="msg"></span>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const COLS=['#ff6b6b','#5ab8ff','#ffd23f'];
const IMG=/^https?:\/\/\S+\.(png|jpe?g|gif|webp|svg)(\?\S*)?$/i;
let qs=[];
function blank(){return{q:'',a:['','',''],c:-1};}
function save(){try{localStorage.setItem('tw1_criador',JSON.stringify({qs,name:$('fname').value}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('tw1_criador')||'null');if(d&&Array.isArray(d.qs)&&d.qs.length){qs=d.qs;if(d.name)$('fname').value=d.name;return;}}catch(e){}qs=[blank()];}
function valid(x){return x.q.trim()&&x.a.every(s=>s.trim())&&x.c>=0;}
function clean(s){return s.replace(/\|/g,'/').replace(/[\r\n]+/g,' ').trim();}
function toText(){
  const ok=qs.filter(valid);
  return '# Escolha Sabiamente — perguntas\n# Formato: Pergunta | resposta 1 | resposta 2 | resposta 3  (a correta começa com *)\n'+
    ok.map(x=>clean(x.q)+' | '+x.a.map((s,i)=>(i===x.c?'*':'')+clean(s)).join(' | ')).join('\n')+'\n';
}
function say(t,ms){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',ms||3500);}
function render(){
  const L=$('list');L.innerHTML='';
  qs.forEach((x,i)=>{
    const d=document.createElement('div');d.className='q'+(valid(x)?'':' bad');
    const h=document.createElement('div');h.className='qh';
    h.innerHTML='<div class="qn">'+(i+1)+'</div>';
    const qi=document.createElement('input');qi.type='text';qi.placeholder='Digite a pergunta';qi.value=x.q;
    qi.oninput=()=>{x.q=qi.value;upd(d,x);};h.appendChild(qi);
    const t=document.createElement('div');t.className='tools';
    [['↑',()=>mv(i,-1)],['↓',()=>mv(i,1)],['⧉',()=>{qs.splice(i+1,0,JSON.parse(JSON.stringify(x)));render();save();}],['✖',()=>{qs.splice(i,1);if(!qs.length)qs.push(blank());render();save();}]].forEach(([s,f],k)=>{
      const b=document.createElement('button');b.textContent=s;b.className='sm'+(k===3?' red':' gray');b.title=['subir','descer','duplicar','excluir'][k];b.onclick=f;t.appendChild(b);});
    h.appendChild(t);d.appendChild(h);
    x.a.forEach((s,k)=>{
      const r=document.createElement('div');r.className='ans'+(x.c===k?' ok':'');
      const rd=document.createElement('input');rd.type='radio';rd.name='c'+i;rd.checked=x.c===k;rd.title='resposta correta';
      rd.onchange=()=>{x.c=k;render();save();};
      const lb=document.createElement('div');lb.className='lbl';lb.style.background=COLS[k];lb.textContent='#'+(k+1);
      const ti=document.createElement('input');ti.type='text';ti.placeholder='Resposta '+(k+1)+' (texto ou link de imagem)';ti.value=s;
      const im=document.createElement('img');im.style.display=IMG.test(s.trim())?'block':'none';im.src=IMG.test(s.trim())?s.trim():'';
      ti.oninput=()=>{x.a[k]=ti.value;const ok=IMG.test(ti.value.trim());im.style.display=ok?'block':'none';im.src=ok?ti.value.trim():'';upd(d,x);};
      r.append(rd,lb,ti,im);d.appendChild(r);
    });
    const w=document.createElement('div');w.className='warn';d.appendChild(w);d._w=w;upd(d,x);
    L.appendChild(d);
  });
  const n=qs.filter(valid).length;$('cnt').textContent=n+' pronta'+(n===1?'':'s')+' / '+qs.length;
  if($('txt').style.display==='block')$('txt').value=toText();
}
function upd(d,x){
  d.classList.toggle('bad',!valid(x));
  const m=[];if(!x.q.trim())m.push('falta a pergunta');if(x.a.some(s=>!s.trim()))m.push('preencha as 3 respostas');if(x.c<0)m.push('marque a resposta certa (bolinha)');
  d._w.textContent=valid(x)?'':'⚠ '+m.join(' · ');
  const n=qs.filter(valid).length;$('cnt').textContent=n+' pronta'+(n===1?'':'s')+' / '+qs.length;
  save();if($('txt').style.display==='block')$('txt').value=toText();
}
function mv(i,d){const j=i+d;if(j<0||j>=qs.length)return;[qs[i],qs[j]]=[qs[j],qs[i]];render();save();}
function parse(text){
  const out=[];
  text.split(/\r?\n/).forEach(l=>{
    if(!l.trim()||l.trim().startsWith('#'))return;
    const p=l.split('|').map(s=>s.trim());if(p.length<4||!p[0])return;
    const a=p.slice(1,4);let c=-1;a.forEach((o,i)=>{if(o.startsWith('*')){c=i;a[i]=o.slice(1).trim();}});
    out.push({q:p[0],a,c});
  });
  return out;
}
$('badd').onclick=()=>{qs.push(blank());render();save();const L=document.querySelectorAll('#list .q');const last=L[L.length-1];last.scrollIntoView({behavior:'smooth',block:'center'});last.querySelector('input[type=text]').focus();};
$('bopen').onclick=()=>$('fopen').click();
$('fopen').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const o=parse(String(r.result));
  if(!o.length){say('Nenhuma pergunta encontrada nesse arquivo');return;}qs=o;$('fname').value=f.name.replace(/\.txt$/i,'');render();save();say('✔ '+o.length+' perguntas abertas');};r.readAsText(f,'utf-8');e.target.value='';};
$('bview').onclick=()=>{const t=$('txt');const on=t.style.display!=='block';t.style.display=on?'block':'none';$('bview').textContent=on?'🙈 Esconder texto':'👁 Ver texto';if(on)t.value=toText();};
$('bclear').onclick=()=>{if(confirm('Apagar todas as perguntas da tela e começar do zero?')){qs=[blank()];render();save();}};
$('fname').oninput=save;
$('bsave').onclick=async()=>{
  const ok=qs.filter(valid).length;
  if(!ok){say('⚠ Nenhuma pergunta completa para salvar',4500);return;}
  const bad=qs.length-ok;
  if(bad&&!confirm(bad+' pergunta(s) incompleta(s) ficarão de fora do arquivo. Salvar mesmo assim?'))return;
  let name=($('fname').value.trim()||'perguntas').replace(/[\\/:*?"<>|]/g,'_').replace(/\.txt$/i,'')+'.txt';
  const blob=new Blob([toText()],{type:'text/plain;charset=utf-8'});
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,id:'tw1perguntas',types:[{description:'Perguntas (.txt)',accept:{'text/plain':['.txt']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();say('✔ Salvo: '+h.name+' ('+ok+' perguntas)',5000);return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  say('✔ Baixado: '+name+' — coloque na pasta do jogo',6000);
};
load();render();
</script>
</body>
</html>
